apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: freelingo
  namespace: freelingo
spec:
  ingressClassName: freelingo
  tls:
    - secretName: freelingo-tls
  rules:
    - http:
        paths:
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
