apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: freelingo
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      nodeName: node2
      imagePullSecrets:
        - name: freelingo-registry
      containers:
        - name: frontend
          image: local-registry:5000/artcc/freelingo-frontend:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: BACKEND_URL
              value: http://backend:8000
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "250m"
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /favicon.ico
              port: 3000
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /favicon.ico
              port: 3000
            initialDelaySeconds: 5
            timeoutSeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: freelingo
spec:
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: ClusterIP
