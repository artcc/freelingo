services:
  postgres:
    image: postgres:16-alpine
    container_name: juba-lisan-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-juba_lisan}
      POSTGRES_USER: ${POSTGRES_USER:-juba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-juba_local_password}
    volumes:
      - juba_lisan_local_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: juba-lisan-local-redis
    restart: unless-stopped
    command: redis-server --requirepass $${REDIS_PASSWORD:-juba_local_redis}
    volumes:
      - juba_lisan_local_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "$${REDIS_PASSWORD:-juba_local_redis}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: juba-lisan-backend:local
    container_name: juba-lisan-local-backend
    restart: unless-stopped
    command: >
      sh -c "cd /app && PYTHONPATH=/app alembic -c /app/alembic.ini upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-juba}:${POSTGRES_PASSWORD:-juba_local_password}@postgres:5432/${POSTGRES_DB:-juba_lisan}
      REDIS_URL: redis://:${REDIS_PASSWORD:-juba_local_redis}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-juba-local-development-secret-change-me}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      TTS_PROVIDER: ${TTS_PROVIDER:-local}
      TTS_BASE_URL: ${TTS_BASE_URL:-http://kokoro:8880}
      STT_PROVIDER: ${STT_PROVIDER:-local}
      STT_BASE_URL: ${STT_BASE_URL:-http://whisper:9000}
      CORS_ORIGINS: '["http://localhost:3000"]'
      COOKIE_SECURE: "false"
      ALLOW_REGISTRATION: "true"
      FIRST_USER_IS_ADMIN: "true"
      # Stripe stays off locally unless STRIPE_ENABLED=true is set in .env.
      STRIPE_ENABLED: ${STRIPE_ENABLED:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_GO_MONTHLY: ${STRIPE_PRICE_GO_MONTHLY:-}
      STRIPE_PRICE_GO_YEARLY: ${STRIPE_PRICE_GO_YEARLY:-}
      STRIPE_PRICE_PLUS_MONTHLY: ${STRIPE_PRICE_PLUS_MONTHLY:-}
      STRIPE_PRICE_PLUS_YEARLY: ${STRIPE_PRICE_PLUS_YEARLY:-}
      STRIPE_PRICE_MONTHLY: ${STRIPE_PRICE_MONTHLY:-}
      STRIPE_PRICE_YEARLY: ${STRIPE_PRICE_YEARLY:-}
      STRIPE_BASE_URL: ${STRIPE_BASE_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: juba-lisan-frontend:local
    container_name: juba-lisan-local-frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  juba_lisan_local_postgres:
  juba_lisan_local_redis:
