name: PR checks (develop)

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: freelingo_ci
          POSTGRES_PASSWORD: freelingo_ci
          POSTGRES_DB: freelingo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U freelingo_ci -d freelingo_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/constraints.txt

      - name: Install backend dependencies
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -r requirements.txt

      - name: Validate migrations on PostgreSQL
        env:
          DATABASE_URL: 'postgresql+asyncpg://freelingo_ci:freelingo_ci@localhost:5432/freelingo_ci'
          SECRET_KEY: ci-secret-key
        run: |
          python - <<'PY'
          from alembic import command
          from alembic.config import Config

          config = Config("alembic.ini")
          config.set_main_option("script_location", "alembic")
          command.upgrade(config, "head")
          PY

      - name: Run backend tests
        env:
          DATABASE_URL: 'sqlite+aiosqlite:///:memory:'
          TEST_POSTGRES_URL: 'postgresql+asyncpg://freelingo_ci:freelingo_ci@localhost:5432/freelingo_ci'
          SECRET_KEY: ci-secret-key
        run: pytest -v

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '25'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up npm
        run: npm install -g npm@11

      - name: Show Node.js and npm versions
        run: |
          node --version
          npm --version

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend type check
        run: npx tsc --noEmit

      - name: Run frontend tests
        run: npm run test:run
