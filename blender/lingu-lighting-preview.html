<!doctype html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lingu Lighting Preview</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0c1316;
      --surface: #131d22;
      --border: #29383f;
      --text: #f5f5f5;
      --muted: #999;
      --accent: #75b7c5;
      --accent-fg: #0a0a0a;
      --input-bg: #0c1316;
      --shadow: rgb(0 0 0 / 24%);
    }

    html[data-theme='light'] {
      color-scheme: light;
      --bg: #f2f6f7;
      --surface: #fbfcfc;
      --border: #d7e1e5;
      --text: #0a0a0a;
      --muted: #666;
      --accent: #286779;
      --accent-fg: #fff;
      --input-bg: #fff;
      --shadow: rgb(12 19 22 / 10%);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      transition: background-color 180ms ease, color 180ms ease;
    }

    button,
    select,
    input {
      font: inherit;
    }

    .page {
      width: min(1180px, 100%);
      margin-inline: auto;
      padding: 28px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: .02em;
    }

    .subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .theme-switch,
    .toolbar,
    .control-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button,
    select {
      min-height: 38px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
    }

    button {
      padding: 8px 12px;
      cursor: pointer;
    }

    button:hover,
    button[aria-pressed='true'] {
      border-color: var(--accent);
    }

    button[aria-pressed='true'] {
      color: var(--accent);
    }

    button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: var(--accent-fg);
    }

    button:disabled {
      cursor: wait;
      opacity: .65;
    }

    select {
      max-width: 220px;
      padding: 7px 10px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 350px;
      gap: 16px;
      align-items: start;
    }

    .stage,
    .panel {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      box-shadow: 0 12px 32px var(--shadow);
    }

    .stage {
      min-height: 590px;
      display: grid;
      grid-template-rows: 1fr auto;
    }

    #scene {
      min-height: 520px;
      position: relative;
    }

    #scene canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .stage-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
    }

    #message {
      color: var(--muted);
    }

    #message.error {
      color: #ff6b6b;
    }

    .panel {
      padding: 18px;
    }

    .panel-heading {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
      margin-bottom: 16px;
    }

    h2 {
      margin: 0;
      font-size: 15px;
    }

    .small-button {
      min-height: 32px;
      padding: 5px 9px;
      font-size: 12px;
    }

    .control-actions {
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .control {
      margin: 0 0 17px;
    }

    .control-heading {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
      font-size: 13px;
    }

    output {
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    input[type='range'] {
      display: block;
      width: 100%;
      accent-color: var(--accent);
    }

    .color-row {
      display: grid;
      grid-template-columns: 1fr 48px;
      align-items: center;
      gap: 10px;
      margin: 12px 0;
      font-size: 13px;
    }

    input[type='color'] {
      width: 48px;
      height: 32px;
      padding: 2px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--input-bg);
    }

    .divider {
      height: 1px;
      margin: 18px 0;
      background: var(--border);
    }

    .toolbar {
      flex-wrap: wrap;
    }

    .hint {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    @media (max-width: 850px) {
      .page {
        padding: 18px;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .stage {
        min-height: 430px;
      }

      #scene {
        min-height: 360px;
      }
    }

    @media (max-width: 520px) {
      .page {
        padding: 14px;
      }

      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .stage {
        min-height: 350px;
      }

      #scene {
        min-height: 290px;
      }

      .stage-footer {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
  <script type="importmap">
      {
        "imports": {
          "three": "/frontend/node_modules/three/build/three.module.js",
          "three/addons/": "/frontend/node_modules/three/examples/jsm/"
        }
      }
    </script>
</head>

<body>
  <main class="page">
    <header>
      <div>
        <h1>Lingu Lighting Preview</h1>
        <p class="subtitle">Preview the GLB model with the app's lighting setup—without changing the app.</p>
      </div>
      <div class="theme-switch" aria-label="Interface theme">
        <button type="button" data-theme-choice="dark" aria-pressed="true">Dark</button>
        <button type="button" data-theme-choice="light" aria-pressed="false">Light</button>
      </div>
    </header>

    <div class="layout">
      <section class="stage" aria-label="3D preview of Lingu">
        <div id="scene"></div>
        <div class="stage-footer">
          <span id="message">Loading model...</span>
          <div class="toolbar">
            <select id="animation" aria-label="Animation"></select>
            <button id="play" class="primary" type="button" disabled>Play animation</button>
          </div>
        </div>
      </section>

      <aside class="panel">
        <div class="panel-heading">
          <h2>Lighting and exposure</h2>
          <div class="control-actions">
            <button id="copy" class="small-button" type="button">Copy values</button>
            <button id="reset" class="small-button" type="button">Reset to app values</button>
          </div>
        </div>

        <label class="control">
          <span class="control-heading"><span>Hemisphere light</span><output id="hemi-value"></output></span>
          <input id="hemi" type="range" min="0" max="2" step="0.01" value="2" />
        </label>
        <label class="control">
          <span class="control-heading"><span>Key light</span><output id="key-value"></output></span>
          <input id="key" type="range" min="0" max="4" step="0.01" value="4" />
        </label>
        <label class="control">
          <span class="control-heading"><span>Fill light</span><output id="fill-value"></output></span>
          <input id="fill" type="range" min="0" max="3" step="0.01" value="3" />
        </label>
        <label class="control">
          <span class="control-heading"><span>Exposure</span><output id="exposure-value"></output></span>
          <input id="exposure" type="range" min="0.5" max="2" step="0.01" value="1" />
        </label>

        <div class="divider"></div>
        <div class="color-row"><label for="sky">Hemisphere · sky</label><input id="sky" type="color" value="#ffffff" />
        </div>
        <div class="color-row"><label for="ground">Hemisphere · ground</label><input id="ground" type="color"
            value="#527080" /></div>
        <div class="color-row"><label for="key-color">Key light color</label><input id="key-color" type="color"
            value="#ffffff" /></div>
        <div class="color-row"><label for="fill-color">Fill light color</label><input id="fill-color" type="color"
            value="#c5e4ff" /></div>
        <p class="hint">Theme backgrounds match FreeLingo: dark <code>#0c1316</code> and light <code>#f2f6f7</code>.
          Lighting controls affect the model only.</p>
      </aside>
    </div>
  </main>

  <script type="module">
    import {
      AnimationMixer,
      Box3,
      DirectionalLight,
      HemisphereLight,
      LoopOnce,
      LoopRepeat,
      NeutralToneMapping,
      OrthographicCamera,
      Scene,
      Vector3,
      WebGLRenderer,
    } from 'three'
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'

    const defaults = {
      hemi: 2,
      key: 4,
      fill: 3,
      exposure: 1,
      sky: '#ffffff',
      ground: '#527080',
      keyColor: '#ffffff',
      fillColor: '#c5e4ff',
    }
    const loopAnimations = new Set(['reposo', 'pensando', 'hablando', 'escuchando'])
    const host = document.querySelector('#scene')
    const message = document.querySelector('#message')
    const animationSelect = document.querySelector('#animation')
    const playButton = document.querySelector('#play')
    const renderer = new WebGLRenderer({ alpha: true, antialias: true, powerPreference: 'low-power' })
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5))
    renderer.setClearColor(0, 0)
    renderer.toneMapping = NeutralToneMapping
    renderer.toneMappingExposure = defaults.exposure
    host.appendChild(renderer.domElement)

    const scene = new Scene()
        const hemisphere = new HemisphereLight(defaults.sky, defaults.ground, defaults.hemi)
    scene.add(hemisphere)
    const key = new DirectionalLight(defaults.keyColor, defaults.key)
    key.position.set(5, 12, 10)
    scene.add(key)
    const fill = new DirectionalLight(defaults.fillColor, defaults.fill)
    fill.position.set(-6, 7, 4)
    scene.add(fill)

    const camera = new OrthographicCamera(-1, 1, 1, -1, 0.1, 100)
    let mixer
    let model
    let boundsSize = new Vector3(1, 1, 1)
    let currentAction
    let clips = []

    function setMessage(text, error = false) {
      message.textContent = text
      message.classList.toggle('error', error)
    }

    function resize() {
      const width = host.clientWidth || 640
      const height = host.clientHeight || 520
      const aspect = width / height
      const halfHeight = Math.max(boundsSize.y, boundsSize.x / aspect) * 0.55
      camera.left = -halfHeight * aspect
      camera.right = halfHeight * aspect
      camera.top = halfHeight
      camera.bottom = -halfHeight
      camera.updateProjectionMatrix()
      renderer.setSize(width, height)
    }

    function playAnimation(name) {
      const clip = clips.find((item) => item.name === name)
      if (!clip) return
      const action = mixer.clipAction(clip)
      if (currentAction && currentAction !== action) currentAction.fadeOut(0.18)
      action.reset()
      action.setLoop(loopAnimations.has(name) ? LoopRepeat : LoopOnce, loopAnimations.has(name) ? Infinity : 1)
      action.clampWhenFinished = !loopAnimations.has(name)
      action.fadeIn(0.18).play()
      currentAction = action
    }

    function updateLights() {
      hemisphere.intensity = Number(document.querySelector('#hemi').value)
      key.intensity = Number(document.querySelector('#key').value)
      fill.intensity = Number(document.querySelector('#fill').value)
      renderer.toneMappingExposure = Number(document.querySelector('#exposure').value)
      hemisphere.color.set(document.querySelector('#sky').value)
      hemisphere.groundColor.set(document.querySelector('#ground').value)
      key.color.set(document.querySelector('#key-color').value)
      fill.color.set(document.querySelector('#fill-color').value)

      for (const id of ['hemi', 'key', 'fill', 'exposure']) {
        document.querySelector(`#${id}-value`).value = Number(document.querySelector(`#${id}`).value).toFixed(2)
      }
    }

    for (const id of ['hemi', 'key', 'fill', 'exposure', 'sky', 'ground', 'key-color', 'fill-color']) {
      document.querySelector(`#${id}`).addEventListener('input', updateLights)
    }

    document.querySelector('#reset').addEventListener('click', () => {
      const controlIds = { keyColor: 'key-color', fillColor: 'fill-color' }
      for (const [id, value] of Object.entries(defaults)) {
        const control = document.querySelector(`#${controlIds[id] ?? id}`)
        if (control) control.value = value
      }
      updateLights()
    })

    document.querySelector('#copy').addEventListener('click', async (event) => {
      const button = event.currentTarget
      const settings = {
        renderer: {
          toneMapping: 'NeutralToneMapping',
          toneMappingExposure: Number(document.querySelector('#exposure').value),
        },
        hemisphere: {
          skyColor: document.querySelector('#sky').value,
          groundColor: document.querySelector('#ground').value,
          intensity: Number(document.querySelector('#hemi').value),
        },
        keyLight: {
          color: document.querySelector('#key-color').value,
          intensity: Number(document.querySelector('#key').value),
          position: [5, 12, 10],
        },
        fillLight: {
          color: document.querySelector('#fill-color').value,
          intensity: Number(document.querySelector('#fill').value),
          position: [-6, 7, 4],
        },
      }

      try {
        await navigator.clipboard.writeText(JSON.stringify(settings, null, 2))
        button.textContent = 'Copied!'
        window.setTimeout(() => {
          button.textContent = 'Copy values'
        }, 1400)
      } catch {
        setMessage('Clipboard unavailable. Open this page from localhost to copy values.', true)
      }
    })

    document.querySelectorAll('[data-theme-choice]').forEach((button) => {
      button.addEventListener('click', () => {
        const theme = button.dataset.themeChoice
        document.documentElement.dataset.theme = theme
        document.querySelectorAll('[data-theme-choice]').forEach((choice) => {
          choice.setAttribute('aria-pressed', String(choice === button))
        })
      })
    })

    playButton.addEventListener('click', () => playAnimation(animationSelect.value))
    window.addEventListener('resize', resize)
    new ResizeObserver(resize).observe(host)
    updateLights()

    try {
      const gltf = await new GLTFLoader().loadAsync('/frontend/public/models/lingu.glb')
      model = gltf.scene
      mixer = new AnimationMixer(model)
      scene.add(model)
      clips = gltf.animations
      const bounds = new Box3().setFromObject(model)
      for (const clip of clips) {
        const action = mixer.clipAction(clip)
        action.play()
        for (let sample = 0; sample <= 8; sample++) {
          mixer.setTime((clip.duration * sample) / 8)
          model.updateMatrixWorld(true)
          bounds.union(new Box3().setFromObject(model))
        }
        mixer.stopAllAction()
      }
      mixer.setTime(0)
      const center = bounds.getCenter(new Vector3())
      boundsSize = bounds.getSize(new Vector3())
      camera.position.set(center.x, center.y, bounds.max.z + 25)
      camera.lookAt(center)

      for (const clip of clips) {
        const option = document.createElement('option')
        option.value = clip.name
        option.textContent = clip.name
        animationSelect.append(option)
      }
      animationSelect.value = 'saludo'
      playAnimation(animationSelect.value)
      playButton.disabled = false
      setMessage(`Model ready · ${clips.length} animations · lighting controls enabled`)
      resize()
    } catch (error) {
      console.error(error)
      setMessage('Could not load the model. Open this page through the local server described in the README.', true)
    }

    let lastTime = performance.now()
    function render(now) {
      const delta = Math.min((now - lastTime) / 1000, 0.05)
      lastTime = now
      mixer?.update(delta)
      renderer.render(scene, camera)
      requestAnimationFrame(render)
    }
    requestAnimationFrame(render)
  </script>
</body>

</html>
