services:
  postgres:
    image: postgres:16-alpine
    container_name: juba-lisan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${DATA_PATH}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: juba-lisan-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ${DATA_PATH}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: juba-lisan-backend:local
    container_name: juba-lisan-backend
    restart: unless-stopped
    command: >
      sh -c "cd /app && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${UVICORN_WORKERS:-1}"
    volumes:
      - ${DATA_PATH}/avatars:/app/avatars
      - ${DATA_PATH}/audio:/data/audio
      - ${DATA_PATH}/tts_previews:/app/tts_previews
    environment:
      DESKTOP_MODE: ${DESKTOP_MODE:-false}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      SECRET_KEY: ${SECRET_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL}
      TTS_PROVIDER: ${TTS_PROVIDER:-local}
      TTS_BASE_URL: ${TTS_BASE_URL:-http://kokoro:8880}
      TTS_VOICE: ${TTS_VOICE:-af_heart}
      OPENAI_TTS_MODEL: ${OPENAI_TTS_MODEL:-tts-1}
      OPENAI_TTS_VOICE: ${OPENAI_TTS_VOICE:-nova}
      OPENAI_TTS_SPEED: ${OPENAI_TTS_SPEED:-1.0}
      STT_PROVIDER: ${STT_PROVIDER:-local}
      STT_BASE_URL: ${STT_BASE_URL:-http://whisper:9000}
      OPENAI_STT_MODEL: ${OPENAI_STT_MODEL:-whisper-1}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      FIRST_USER_IS_ADMIN: ${FIRST_USER_IS_ADMIN:-true}
      BLOCKED_EMAIL_DOMAINS: ${BLOCKED_EMAIL_DOMAINS:-[]}
      AVAILABLE_TARGET_LANGUAGES: ${AVAILABLE_TARGET_LANGUAGES:-["en-US","en-GB","fr-FR","es-ES","de-DE","it-IT","pt-PT","pt-BR","nl-NL","sv-SE","no-NO","da-DK","fi-FI","pl-PL","cs-CZ","sk-SK","hu-HU","ro-RO","el-GR","tr-TR","ru-RU","uk-UA","ar-SA","ar-DZ","he-IL","fa-IR","hi-IN","bn-BD","id-ID","ms-MY","vi-VN","th-TH","zh-CN","zh-TW","ja-JP","ko-KR"]}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@jubalisan.com}
      SMTP_TLS: ${SMTP_TLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
      DEFAULT_CONVERSATION_MAX_DURATION: ${DEFAULT_CONVERSATION_MAX_DURATION:-1800}
      DEFAULT_CONVERSATION_INACTIVITY_TIMEOUT: ${DEFAULT_CONVERSATION_INACTIVITY_TIMEOUT:-180}
      DEFAULT_CONVERSATION_WEEKLY_SESSIONS: ${DEFAULT_CONVERSATION_WEEKLY_SESSIONS:-0}
      DEFAULT_CONVERSATION_DAILY_MINUTES: ${DEFAULT_CONVERSATION_DAILY_MINUTES:-30}
      DEFAULT_CONVERSATION_WEEKLY_MINUTES: ${DEFAULT_CONVERSATION_WEEKLY_MINUTES:-90}
      DEFAULT_MONTHLY_TOKENS_LIMIT: ${DEFAULT_MONTHLY_TOKENS_LIMIT:-1000000}
      ASSESSMENT_VOICE_TRIAL_DURATION_SECONDS: ${ASSESSMENT_VOICE_TRIAL_DURATION_SECONDS:-300}
      FREEMIUM_CHAT_DAILY_MESSAGES: ${FREEMIUM_CHAT_DAILY_MESSAGES:-5}
      FREEMIUM_LESSONS_DAILY: ${FREEMIUM_LESSONS_DAILY:-3}
      FREEMIUM_LISTENING_WEEKLY: ${FREEMIUM_LISTENING_WEEKLY:-3}
      FREEMIUM_READING_WEEKLY: ${FREEMIUM_READING_WEEKLY:-3}
      FREEMIUM_VOICE_WEEKLY_MINUTES: ${FREEMIUM_VOICE_WEEKLY_MINUTES:-5}
      FREEMIUM_TRIAL_ENABLED: ${FREEMIUM_TRIAL_ENABLED:-true}
      FREEMIUM_TRIAL_DAYS: ${FREEMIUM_TRIAL_DAYS:-7}
      STRIPE_ENABLED: ${STRIPE_ENABLED:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_MONTHLY: ${STRIPE_PRICE_MONTHLY:-}
      STRIPE_PRICE_YEARLY: ${STRIPE_PRICE_YEARLY:-}
      STRIPE_PRICE_GO_MONTHLY: ${STRIPE_PRICE_GO_MONTHLY:-}
      STRIPE_PRICE_GO_YEARLY: ${STRIPE_PRICE_GO_YEARLY:-}
      STRIPE_PRICE_PLUS_MONTHLY: ${STRIPE_PRICE_PLUS_MONTHLY:-}
      STRIPE_PRICE_PLUS_YEARLY: ${STRIPE_PRICE_PLUS_YEARLY:-}
      STRIPE_TRIAL_DAYS: ${STRIPE_TRIAL_DAYS:-7}
      STRIPE_BASE_URL: ${STRIPE_BASE_URL:-http://localhost:3000}
      PRICE_MONTHLY: ${PRICE_MONTHLY:-14.95}
      PRICE_YEARLY: ${PRICE_YEARLY:-149.50}
      TOTAL_PRICE_MONTHLY: ${TOTAL_PRICE_MONTHLY:-19.95}
      TOTAL_PRICE_YEARLY: ${TOTAL_PRICE_YEARLY:-199.50}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: juba-lisan-frontend:local
    container_name: juba-lisan-frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${NEXT_PUBLIC_UMAMI_SCRIPT_URL:-}
      NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/', r => process.exit(r.statusCode >= 200 && r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # GPU-only speech services are opt-in so the core stack can start on
  # machines without NVIDIA/CUDA, including Intel-only Windows PCs.
  kokoro:
    profiles: ["gpu"]
    image: ghcr.io/remsky/kokoro-fastapi-gpu:latest-cu128
    container_name: juba-lisan-kokoro
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  whisper:
    profiles: ["gpu"]
    image: onerahmet/openai-whisper-asr-webservice:latest-gpu
    container_name: juba-lisan-whisper
    restart: unless-stopped
    environment:
      - ASR_MODEL=${STT_MODEL:-large-v3-turbo}
      - ASR_ENGINE=${STT_ENGINE:-faster_whisper}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
